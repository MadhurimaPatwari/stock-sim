spring:
  application:
    name: stock-sim

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksim}
    username: ${DB_USER:stocksim}
    password: ${DB_PASSWORD:stocksim}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
